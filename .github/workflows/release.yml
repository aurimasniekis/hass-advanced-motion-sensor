name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version custom_components/advance_motion_sensor/manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match manifest version $version"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
