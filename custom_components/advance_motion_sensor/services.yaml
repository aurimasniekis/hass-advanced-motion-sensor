stop_timer:
  name: Stop timer
  description: Stop the off-delay timer of an Advanced Motion Sensor state sensor.
  target:
    entity:
      domain: sensor
      integration: advance_motion_sensor

register_multiple:
  name: Register multiple
  description: Create several Advanced Motion Sensor entries at once. Returns the result for each entry.
  fields:
    entries:
      name: Entries
      description: List of entries, each with a name, timeout (seconds) and list of binary_sensor sources.
      required: true
      example:
        - name: "Hallway"
          timeout: 120
          sources: ["binary_sensor.hallway_motion_1", "binary_sensor.hallway_motion_2"]
        - name: "Kitchen"
          timeout: 60
          sources: ["binary_sensor.kitchen_motion"]
      selector:
        object:
